# Dependabot version updates (https://docs.github.com/en/code-security/dependabot).
# Keeps the SHA pins of the workflow actions and their "# vX.Y.Z" comments current, the
# hash-pinned Python tools in requirements-dev.txt and the npm build tools. A 7-day cooldown lets a
# bad release surface before it lands here. The pinned gitleaks and actionlint downloads (version +
# sha256 inputs in the reusable workflows) are not seen by Dependabot; bump them by hand
# (PUBLISHING.md, monthly).
#
# Pull request titles must pass the pr-title check (Conventional Commits): "prefix" sets the type
# and "include: scope" adds the scope, so the titles read "ci(deps): ..." and "build(deps): ...".
# Dependabot capitalises the summary ("Bump ..."); scripts/check_pr_title.py relaxes only the
# lower-case rule for dependabot[bot] (same configuration as oss-template).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@vitejs/plugin-react"]
      build-tools:
        patterns: ["vite", "lightningcss", "typescript"]
      test-tools:
        patterns: ["vitest", "fast-check", "jsdom", "@testing-library/*"]
    ignore:
      # The gallery mirrors the panel's default theme, which is built on Bulma 0.9.4.
      - dependency-name: bulma
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
