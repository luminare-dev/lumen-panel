# Temporary: creates package-lock.json on a GitHub runner (the development host has too little
# free memory for npm). Remove this workflow in the commit that adds the lockfile.
name: bootstrap-lockfile

on:
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Resolve the dependency tree (no install scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Keep package-lock.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
