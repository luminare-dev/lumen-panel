# Caller: lint, tests and the full-history secret scan on every pull request and push to main,
# plus the project's own asset build (stylesheets, command palette, gallery: type check, unit
# tests, build, bundle check) and an end-to-end generator build against the fake panel tree of
# the tests. The static gallery is kept as a build artifact for 14 days.
# Required checks for the main ruleset: "ci / lint-test", "assets", "secrets / gitleaks".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded pull request runs are cancelled. Each commit on main gets its own group, so it
  # always keeps its CI result (a shared group would still drop all but the newest pending run).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  assets:
    name: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Type check (TypeScript, command palette and gallery)
        run: npm run typecheck

      - name: Command palette unit tests (Vitest, jsdom, Testing Library)
        run: npm test

      - name: Build stylesheets, command palette (with its size and API check) and gallery
        run: npm run build

      - name: Contrast table is current and every pair passes
        run: python3 scripts/contrast.py --check

      - name: Generator build and verify with the built assets (fake panel tree)
        run: |
          set -euo pipefail
          python3 tests/fakekeyhelp.py "$RUNNER_TEMP/keyhelp"
          cd generator
          python3 -m lumen_panel build --keyhelp "$RUNNER_TEMP/keyhelp" --out "$RUNNER_TEMP/lumen"
          python3 -m lumen_panel verify "$RUNNER_TEMP/lumen" --keyhelp "$RUNNER_TEMP/keyhelp"
          test -f "$RUNNER_TEMP/lumen/assets/lumen-island.js"

      - name: Built file sizes
        run: |
          ls -l dist/assets dist/assets/brand gallery/dist gallery/dist/assets
          node scripts/check-island.mjs

      - name: Keep the static gallery as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery
          path: gallery/dist
          if-no-files-found: error
          retention-days: 14

      - name: Keep the built theme assets (installed on the server from this artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-assets
          path: dist/assets
          if-no-files-found: error
          retention-days: 30
