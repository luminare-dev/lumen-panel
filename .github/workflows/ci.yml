# Lint, tests, secret scan, the asset build and a generator build of both themes.
# Required checks: "ci / lint-test", "assets", "secrets / gitleaks".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded pull request runs are cancelled. Each commit on main gets its own group, so it
  # always keeps its CI result (a shared group would still drop all but the newest pending run).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  assets:
    name: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Type check (TypeScript, command palette and gallery)
        run: npm run typecheck

      - name: Command palette unit tests (Vitest, jsdom, Testing Library)
        run: npm test

      - name: Build stylesheets, command palette (with its size and API check) and gallery
        run: npm run build

      - name: Contrast table is current and every pair passes
        run: python3 scripts/contrast.py --check

      - name: Generator build and verify of both themes with the built assets (fake panel tree)
        run: |
          set -euo pipefail
          python3 tests/fakekeyhelp.py "$RUNNER_TEMP/keyhelp"
          cd generator
          for variant in lumen lumen-dark; do
            python3 -m lumen_panel build --variant "$variant" --keyhelp "$RUNNER_TEMP/keyhelp" \
              --out "$RUNNER_TEMP/$variant"
            python3 -m lumen_panel verify "$RUNNER_TEMP/$variant" --variant "$variant" --keyhelp "$RUNNER_TEMP/keyhelp"
            test -f "$RUNNER_TEMP/$variant/assets/lumen-island.js"
          done
          # each theme folder holds its own stylesheets only
          test -f "$RUNNER_TEMP/lumen/assets/lumen.css"
          test ! -e "$RUNNER_TEMP/lumen/assets/lumen-night.css"
          test -f "$RUNNER_TEMP/lumen-dark/assets/lumen-night-rtl.css"
          test ! -e "$RUNNER_TEMP/lumen-dark/assets/lumen.css"

      - name: Lumen Dark never refers to the panel's dark stylesheets or images
        run: |
          set -euo pipefail
          test -f dist/assets/lumen-night.css
          test -f dist/assets/lumen-night-rtl.css
          if grep -l -e 'style-dark' -e 'img/dark' -e 'is_dark_mode' -e 'has_dark_mode' -e '/theme/bulma/' \
              dist/assets/lumen-night.css dist/assets/lumen-night-rtl.css; then
            echo "error: a Lumen Dark stylesheet refers to the panel's dark mode or its files" >&2
            exit 1
          fi
          # the same check as the unit test, here with the built files present
          python3 -m unittest tests.test_variants.ProBoundaryTest.test_lumen_dark_css_never_uses_the_panel_dark_assets

      - name: Built file sizes
        run: |
          ls -l dist/assets dist/assets/brand gallery/dist gallery/dist/assets
          node scripts/check-island.mjs

      - name: Keep the static gallery as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/dist
          if-no-files-found: error
          retention-days: 14

      - name: Keep the built theme assets of both themes (installed on the server from this artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-assets
          path: dist/assets
          if-no-files-found: error
          retention-days: 30
