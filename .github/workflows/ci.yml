# Lint, tests, secret scan, the asset build and a generator build of both themes.
# Required checks: "ci / lint-test", "assets", "secrets / gitleaks". The customizer job builds the
# customizer page, compiles every preset and screenshots the preview in headless Chrome.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded pull request runs are cancelled. Each commit on main gets its own group, so it
  # always keeps its CI result (a shared group would still drop all but the newest pending run).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  assets:
    name: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Type check (TypeScript, command palette and gallery)
        run: npm run typecheck

      - name: Command palette unit tests (Vitest, jsdom, Testing Library)
        run: npm test

      - name: Build stylesheets, command palette (with its size and API check) and gallery
        run: npm run build

      - name: Contrast table is current and every pair passes
        run: python3 scripts/contrast.py --check

      - name: Generator build and verify of both themes with the built assets (fake panel tree)
        run: |
          set -euo pipefail
          python3 tests/fakekeyhelp.py "$RUNNER_TEMP/keyhelp"
          cd generator
          for variant in lumen lumen-dark; do
            python3 -m lumen_panel build --variant "$variant" --keyhelp "$RUNNER_TEMP/keyhelp" \
              --out "$RUNNER_TEMP/$variant"
            python3 -m lumen_panel verify "$RUNNER_TEMP/$variant" --variant "$variant" --keyhelp "$RUNNER_TEMP/keyhelp"
            test -f "$RUNNER_TEMP/$variant/assets/lumen-island.js"
          done
          # each theme folder holds its own stylesheets only
          test -f "$RUNNER_TEMP/lumen/assets/lumen.css"
          test ! -e "$RUNNER_TEMP/lumen/assets/lumen-night.css"
          test -f "$RUNNER_TEMP/lumen-dark/assets/lumen-night-rtl.css"
          test ! -e "$RUNNER_TEMP/lumen-dark/assets/lumen.css"

      - name: Lumen Dark never refers to the panel's dark stylesheets or images
        run: |
          set -euo pipefail
          test -f dist/assets/lumen-night.css
          test -f dist/assets/lumen-night-rtl.css
          if grep -l -e 'style-dark' -e 'img/dark' -e 'is_dark_mode' -e 'has_dark_mode' -e '/theme/bulma/' \
              dist/assets/lumen-night.css dist/assets/lumen-night-rtl.css; then
            echo "error: a Lumen Dark stylesheet refers to the panel's dark mode or its files" >&2
            exit 1
          fi
          # the same check as the unit test, here with the built files present
          python3 -m unittest tests.test_variants.ProBoundaryTest.test_lumen_dark_css_never_uses_the_panel_dark_assets

      - name: Built file sizes
        run: |
          ls -l dist/assets dist/assets/brand gallery/dist gallery/dist/assets
          node scripts/check-island.mjs

      - name: Keep the static gallery as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/dist
          if-no-files-found: error
          retention-days: 14

      - name: Keep the built theme assets of both themes (installed on the server from this artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-assets
          path: dist/assets
          if-no-files-found: error
          retention-days: 30

  customizer:
    name: customizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Shared token code matches shared.lock (local copies and the locked source commit)
        run: python3 scripts/check_shared.py fetch

      - name: Build the stylesheets and the command palette
        run: npm run build:css && npm run build:island

      - name: Compile every preset into a customization folder
        run: |
          set -euo pipefail
          for preset in luminare graphite aurora contrast; do
            node --experimental-strip-types --no-warnings tokens/compile.mjs \
              --preset "$preset" --out "dist/presets/$preset"
          done
          ls -l dist/presets/*

      - name: Build the customizer page
        run: |
          node --no-warnings customizer/build.mjs --assets dist/assets \
            --bulma node_modules/bulma/css/bulma.min.css --out dist/customizer/lumen-panel-customizer.html

      - name: Parity (embedded compiler and tokens/*.ts, every preset and case)
        run: |
          node --experimental-strip-types --no-warnings tests/parity/run.mjs \
            dist/customizer/lumen-panel-customizer.html

      - name: The page makes no request (no URL outside the CSP-blocked set)
        run: |
          set -euo pipefail
          page=dist/customizer/lumen-panel-customizer.html
          grep -q "default-src 'none'" "$page"
          if grep -o -E '(src|href)="https?://[^"]*"' "$page"; then
            echo "error: the customizer page links an external resource" >&2
            exit 1
          fi

      - name: Generator build of both themes with every compiled preset (fake panel tree)
        run: |
          set -euo pipefail
          python3 tests/fakekeyhelp.py "$RUNNER_TEMP/keyhelp"
          cd generator
          for preset in luminare graphite aurora contrast; do
            for variant in lumen lumen-dark; do
              out="$RUNNER_TEMP/build-$preset-$variant"
              python3 -m lumen_panel build --variant "$variant" --keyhelp "$RUNNER_TEMP/keyhelp" \
                --assets ../dist/assets --custom "../dist/presets/$preset" --out "$out" >/dev/null
              python3 -m lumen_panel verify "$out" --keyhelp "$RUNNER_TEMP/keyhelp" >/dev/null
            done
          done
          echo "8 builds verified"

      - name: Screenshots of the preview (headless Chrome)
        run: |
          set -euo pipefail
          google-chrome --version
          page="file://$PWD/dist/customizer/lumen-panel-customizer.html"
          mkdir -p screenshots
          shot() { # name, hash
            google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
              --window-size=1440,1000 --virtual-time-budget=5000 \
              --screenshot="screenshots/$1.png" "$page#$2" 2>/dev/null
            test -s "screenshots/$1.png"
          }
          for preset in luminare graphite aurora contrast; do
            for mode in light dark night; do
              shot "$preset-$mode" "preset=$preset&mode=$mode"
            done
          done
          shot luminare-login "preset=luminare&mode=light&screen=login"
          shot aurora-night-login "preset=aurora&mode=night&screen=login"
          ls -l screenshots

      - name: Keep the customizer page and the compiled presets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: customizer
          path: |
            dist/customizer
            dist/presets
          if-no-files-found: error
          retention-days: 30

      - name: Keep the screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: customizer-screenshots
          path: screenshots
          if-no-files-found: error
          retention-days: 14
