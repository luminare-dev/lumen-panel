# release-please, then build the source archive, SHA256SUMS and provenance, attach them to the
# draft release and publish it, all in one run.
name: reusable-release

on:
  workflow_call:
    inputs:
      archive-name:
        description: Name of the source archive (default the repository name, lower-cased).
        type: string
        default: ""
      test-command:
        description: Run before packaging; the release fails if the tests fail on the tag.
        type: string
        default: python3 -m unittest discover -s tests -v
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # release commit, tag and draft release
      pull-requests: write   # open and update the release pull request
      issues: write          # labels such as "autorelease: pending"
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Tests on the tag
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: Source archive and SHA256SUMS
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCHIVE_NAME: ${{ inputs.archive-name || github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --ref HEAD --version "${TAG#v}" --name "$ARCHIVE_NAME" --out dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # attach files and publish the draft release
      id-token: write        # Sigstore certificate for the attestation
      attestations: write    # store the attestation
    steps:
      - name: Fetch the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The attestation as a release file, so it can be checked without the GitHub API:
      # <archive>.intoto.jsonl is the Sigstore bundle actions/attest wrote (one JSON line: signing
      # certificate, transparency-log entry, DSSE envelope with the SLSA v1 provenance statement),
      # the format and name slsa-github-generator v2.1+ uses. Checked here with the command from
      # docs/install.md while the release is still a draft. Skipped with the attest step.
      # The certificate of a reusable workflow names that workflow (job_workflow_ref), so
      # --signer-workflow is this file; --source-ref requires a run started from the default branch.
      - name: Add the provenance file and verify it
        if: ${{ steps.attest.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          cp "$BUNDLE" "${archives[0]}.intoto.jsonl"
          gh attestation verify "${archives[0]}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/reusable-release.yml" \
            --source-ref "refs/heads/$DEFAULT_BRANCH" --bundle "${archives[0]}.intoto.jsonl"

      - name: Attach the files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
